<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Clínico RIAS 3280</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        <h2>Asistente Clínico RIAS - Res. 3280</h2>
        
        <div class="tarjeta-filtro">
            <label for="edad">Edad del Paciente (Años):</label>
            <input type="number" id="edad" placeholder="Ej: 46" min="0" step="1">

            <label for="sexo">Sexo Biológico:</label>
            <select id="sexo">
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
            </select>

            <button onclick="consultarRuta()">Generar Intervenciones RIAS</button>
        </div>

        <div id="resultados" class="contenedor-resultados">
            <p style="color: #666; text-align: center;">Ingrese los datos del paciente para consultar la norma.</p>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
